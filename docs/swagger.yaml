basePath: /
definitions:
  dto.LinksRequest:
    properties:
      is_custom:
        example: false
        type: boolean
      original_url:
        example: https://example.com/long-url-path
        type: string
      short_url:
        example: my-custom-slug
        maxLength: 20
        minLength: 3
        type: string
    required:
    - original_url
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: almarufhidayat99@gmail.com
        type: string
      password:
        example: Admin@1234
        minLength: 8
        type: string
    required:
    - email
    type: object
  dto.RegisterRequest:
    properties:
      email:
        example: almarufhidayat99@gmail.com
        type: string
      password:
        example: Admin@1234
        minLength: 8
        type: string
    required:
    - email
    type: object
  dto.ResponseError:
    properties:
      data: {}
      message:
        example: failed
        type: string
      success:
        example: false
        type: boolean
    type: object
  dto.ResponseSuccess:
    properties:
      data: {}
      message:
        example: success
        type: string
      success:
        example: true
        type: boolean
    type: object
host: localhost:5000
info:
  contact: {}
  description: This is a sample send request use API.
  title: Application ShortLink App
  version: "1.0"
paths:
  /{slug}:
    get:
      description: Redirect user to the original URL by short_url slug
      parameters:
      - description: Short URL slug
        in: path
        name: short_url
        required: true
        type: string
      responses:
        "302":
          description: Redirect to original URL
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      summary: Redirect Short Link
      tags:
      - Redirect
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Log in for get full access
      parameters:
      - description: Body data to access ewalet
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseSuccess'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
      summary: Log In
      tags:
      - Auth
  /api/auth/logout:
    delete:
      description: Log out for delete access user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseSuccess'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - Bearer: []
      summary: Log out
      tags:
      - Auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Create new account for full access
      parameters:
      - description: Body data new user
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseSuccess'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      summary: Create New Account
      tags:
      - Auth
  /api/links:
    get:
      description: Get My short link for authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseSuccess'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - Bearer: []
      summary: Get My Short Link
      tags:
      - Links
    post:
      consumes:
      - application/json
      description: Create new short link for authenticated user
      parameters:
      - description: Body data create short link
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LinksRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ResponseSuccess'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - Bearer: []
      summary: Create New Short Link
      tags:
      - Links
securityDefinitions:
  Bearer:
    description: Bearer Token used as identity for accessing backend
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
